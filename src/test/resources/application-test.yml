spring:
  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

  flyway:
    enabled: false

jwt:
  access:
    secret: ${TEST_JWT_ACCESS_SECRET}
    expiration: ${TEST_JWT_ACCESS_EXPIRATION:900000}

  refresh:
    secret: ${TEST_JWT_REFRESH_SECRET}
    expiration: ${TEST_JWT_REFRESH_EXPIRATION:604800000}